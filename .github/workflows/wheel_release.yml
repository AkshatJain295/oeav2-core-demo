name: OEA Release Publisher

# Manual trigger only.
#   release/YYYY-MM branch -> production tag   vYYYY.MM.<n>          (e.g. v2026.09.1)
#   any other branch       -> dev/test tag     vYYYY.MM.<n>.dev<run> (e.g. v2026.09.1.dev12)
# Dev releases are published as pre-releases, are never marked "Latest", and are
# removed automatically by the "Cleanup dev releases" workflow.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "release/* branch: vYYYY.MM.<n> (e.g. v2026.09.1). Any other branch: vYYYY.MM.<n>.dev<run> (e.g. v2026.09.1.dev12)"
        required: true

permissions:
  contents: write  # allows tag creation and release

jobs:
  build-and-upload-wheel:
    runs-on: ubuntu-latest

    steps:
    # The tag input is passed through env (never interpolated into the script)
    # and only written to RELEASE_TAG after it has passed validation.
    - name: Validate release tag against branch
      env:
        INPUT_TAG: ${{ github.event.inputs.release_tag }}
      run: |
        BRANCH="${GITHUB_REF_NAME}"
        TAG="${INPUT_TAG}"
        CLEAN='^v[0-9]{4}\.[0-9]{2}\.[0-9]+$'
        DEV='^v[0-9]{4}\.[0-9]{2}\.[0-9]+\.dev[0-9]+$'

        if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
          echo "::error::Run this workflow from a branch, not a tag (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}')."
          exit 1
        fi

        if [[ "$BRANCH" == release/* ]]; then
          if ! [[ "$BRANCH" =~ ^release/([0-9]{4})-([0-9]{2})$ ]]; then
            echo "::error::Release branch '$BRANCH' must be named release/YYYY-MM."
            exit 1
          fi
          YEAR="${BASH_REMATCH[1]}"
          MONTH="${BASH_REMATCH[2]}"
          if ! [[ "$TAG" =~ $CLEAN ]]; then
            echo "::error::'$TAG' is not a valid release tag for a release/* branch. Expected vYYYY.MM.<n> (e.g. v${YEAR}.${MONTH}.1), no suffix."
            exit 1
          fi
          if [[ "$TAG" != v${YEAR}.${MONTH}.* ]]; then
            echo "::error::Tag '$TAG' does not match branch '$BRANCH'. Expected a tag starting with v${YEAR}.${MONTH}."
            exit 1
          fi
        else
          if ! [[ "$TAG" =~ $DEV ]]; then
            echo "::error::'$TAG' is not a valid dev/test tag for branch '$BRANCH'. Expected vYYYY.MM.<n>.dev<run> (e.g. v2026.09.1.dev${GITHUB_RUN_NUMBER})."
            exit 1
          fi
        fi

        echo "Tag '$TAG' is valid for branch '$BRANCH'."
        echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0   # full history + tags needed for tagging and "latest" detection

    - name: Check if Git tag exists
      run: |
        if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
          echo "::error::Tag $RELEASE_TAG already exists!"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install build tools
      run: python -m pip install --upgrade pip setuptools wheel build

    - name: Build Wheel
      run: |
        # Write version from the validated tag
        echo "${RELEASE_TAG#v}" > VERSION
        cat VERSION
        python -m build --wheel

    - name: Zip notebooks
      run: |
        if [ -d cloud ]; then
          zip -r notebooks.zip cloud
        else
          echo "cloud/ directory not found, skipping zip"
        fi

    - name: Zip DSLs
      run: |
        if [ -d dags ]; then
          zip -r dags.zip dags
        else
          echo "dags/ directory not found, skipping zip"
        fi

    - name: Zip Documentation
      run: |
        if [ -d docs ]; then
          zip -r docs.zip docs
        else
          echo "docs/ directory not found, skipping zip"
        fi

    # The tag is created only after the build succeeded, so a failed build
    # doesn't leave an orphan tag that blocks retrying with the same name.
    - name: Configure Git
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

    - name: Create Annotated Git Tag
      run: |
        git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
        git push origin "$RELEASE_TAG"

    - name: Create GitHub Release & upload assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ "$RELEASE_TAG" == *.dev* ]]; then
          # Dev/test build: pre-release, never "Latest".
          FLAGS=(--prerelease --latest=false)
        else
          # Only the highest production tag gets the "Latest" badge, so a
          # hotfix tag on an older release branch doesn't take it over.
          HIGHEST=$(git tag --list 'v*' | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]+$' | sort -V | tail -1)
          if [ "$HIGHEST" = "$RELEASE_TAG" ]; then
            FLAGS=(--latest)
          else
            FLAGS=(--latest=false)
          fi
        fi

        gh release create "$RELEASE_TAG" dist/*.whl \
          notebooks.zip \
          dags.zip \
          docs.zip \
          --title "Release $RELEASE_TAG" \
          "${FLAGS[@]}"
