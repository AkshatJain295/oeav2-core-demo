name: Deploy to Dev

# Deploys a build (usually a .dev release cut from a feature branch) to the
# shared Dev workspace for testing.
on:
  workflow_dispatch:
    inputs:
      core_release_tag:
        description: "e.g. v2026.09.1.dev12 (a production tag also works)"
        required: true
      dry_run:
        description: "Run every check and approval but make no call to Fabric"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy-notebook.yml
    with:
      target_config_name: "dev"
      core_release_tag: ${{ inputs.core_release_tag }}
      environment_name: "dev"
      allow_dev_tags: true
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
