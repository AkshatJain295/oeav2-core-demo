# Reusable workflow: validates the request, triggers the OEA deployment notebook in
# Fabric via the "Run notebook" job API, polls until it finishes, and records the
# outcome in the deployment log. Not run directly; called by deploy_dev.yml,
# deploy_qa.yml and deploy_prod.yml.
#
# Nothing about a target is stored in the repo. Whoever runs a deploy supplies the
# workspace ID, the module flags and the release tag, and reviewers approve exactly
# those values (they are shown in the run summary before the approval prompt).
#
# Three jobs:
#   validate - cheap checks, no environment, so it runs BEFORE any approval prompt.
#   deploy   - bound to a GitHub Environment (the approval gate for Prod).
#   record   - writes who/what/when/result to the `logs` branch, whatever happened.
name: Deploy OEA Notebook (reusable)

on:
  workflow_call:
    inputs:
      tenant:
        description: "Label for this target: the GitHub Environment name (approval gate) and the name shown in the deployment log"
        required: true
        type: string
      workspace_id:
        description: "GUID of the Fabric workspace to deploy into"
        required: true
        type: string
      core_release_tag:
        description: "OEAv2-Core release tag to deploy"
        required: true
        type: string
      modules:
        description: "JSON object of module flags, each true or false"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment to run under (Prod environments carry the required reviewers)"
        required: true
        type: string
      allow_dev_tags:
        description: "true for dev/QA (may deploy .dev builds), false for Prod"
        required: false
        type: boolean
        default: false
      require_protected_environment:
        description: "true for Prod: refuse to run unless the environment has required reviewers"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "true = run every check and approval and build the request, but make no call to Fabric"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      modules_json: ${{ steps.check.outputs.modules_json }}
      modules_enabled: ${{ steps.check.outputs.modules_enabled }}
    steps:
      - name: Validate deploy request
        id: check
        env:
          TENANT: ${{ inputs.tenant }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          CORE_TAG: ${{ inputs.core_release_tag }}
          MODULES: ${{ inputs.modules }}
          ALLOW_DEV: ${{ inputs.allow_dev_tags }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENV_NAME: ${{ inputs.environment_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ERRORS=0
          fail() { echo "::error::$1"; ERRORS=$((ERRORS + 1)); }

          CLEAN='^v[0-9]{4}\.[0-9]{2}\.[0-9]+$'
          DEV='^v[0-9]{4}\.[0-9]{2}\.[0-9]+\.dev[0-9]+$'
          GUID='^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'
          # Keep in sync with KNOWN_MODULE_KEYS in the deployment notebook.
          KNOWN='["fetch_releases","create_folders","create_environment","create_lakehouses","deploy_notebooks","deploy_dashboards","bootstrap_and_rebind"]'
          DEFAULTS='{"fetch_releases":true,"create_folders":false,"create_environment":false,"create_lakehouses":false,"deploy_notebooks":false,"deploy_dashboards":false,"bootstrap_and_rebind":false}'

          # --- tenant label (doubles as the environment name) ---
          if ! [[ "$TENANT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            fail "tenant '$TENANT' is invalid (lowercase letters, digits and hyphens only)."
          fi

          # --- workspace ---
          if ! [[ "$WORKSPACE_ID" =~ $GUID ]]; then
            fail "workspace_id '$WORKSPACE_ID' is not a valid GUID (expected 8-4-4-4-12 hex digits)."
          fi

          # --- release tag format ---
          if [[ "$CORE_TAG" =~ $CLEAN ]]; then
            :
          elif [[ "$CORE_TAG" =~ $DEV ]]; then
            if [ "$ALLOW_DEV" != "true" ]; then
              fail "core_release_tag '$CORE_TAG' is a dev release. Dev releases can only be deployed to dev/QA, never Prod."
            fi
          else
            fail "core_release_tag '$CORE_TAG' is not a valid release tag (expected vYYYY.MM.<n>, or vYYYY.MM.<n>.dev<run> for dev/QA)."
          fi

          # --- the release must actually exist in this repo ---
          if [[ "$CORE_TAG" =~ $CLEAN || "$CORE_TAG" =~ $DEV ]]; then
            if INFO=$(gh release view "$CORE_TAG" --repo "$GH_REPO" --json isPrerelease 2>/dev/null); then
              if [ "$ALLOW_DEV" != "true" ] && [ "$(echo "$INFO" | jq -r '.isPrerelease')" = "true" ]; then
                fail "core release '$CORE_TAG' is marked pre-release and can't be deployed to Prod."
              fi
            else
              fail "core release '$CORE_TAG' was not found in $GH_REPO. Run OEA Release Publisher first."
            fi
          fi

          # --- modules: a JSON object of known keys with true/false values ---
          NORMALIZED=""
          if ! echo "$MODULES" | jq -e 'type == "object"' >/dev/null 2>&1; then
            fail "modules must be a JSON object such as {\"deploy_notebooks\": true}."
          else
            UNKNOWN=$(echo "$MODULES" | jq -r --argjson known "$KNOWN" '[keys[] | select(. as $k | $known | index($k) | not)] | join(", ")')
            NONBOOL=$(echo "$MODULES" | jq -r '[to_entries[] | select(.value | type != "boolean") | .key] | join(", ")')
            [ -z "$UNKNOWN" ] || fail "modules has unknown key(s): $UNKNOWN. Known keys: $(echo "$KNOWN" | jq -r 'join(", ")')."
            [ -z "$NONBOOL" ] || fail "modules values must be true or false, not text or numbers. Fix: $NONBOOL."
            if [ -z "$UNKNOWN" ] && [ -z "$NONBOOL" ]; then
              NORMALIZED=$(jq -cn --argjson d "$DEFAULTS" --argjson m "$MODULES" '$d + $m')
              DEPLOY_MODULES=$(echo "$NORMALIZED" | jq '[to_entries[] | select(.value == true and .key != "fetch_releases")] | length')
              if [ "$DEPLOY_MODULES" -eq 0 ]; then
                fail "no module is enabled, so there is nothing to deploy. Set at least one module other than fetch_releases to true."
              fi
            fi
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "Validation failed with $ERRORS error(s)."
            exit 1
          fi

          ENABLED=$(echo "$NORMALIZED" | jq -r '[to_entries[] | select(.value == true) | .key] | join(",")')
          {
            echo "modules_json=$NORMALIZED"
            echo "modules_enabled=$ENABLED"
          } >> "$GITHUB_OUTPUT"

          # Shown on the run page BEFORE the approval prompt: this is what reviewers check.
          {
            echo "### Deploy request"
            echo "Reviewers: check the tenant, workspace and release below match what you expect before approving."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tenant | \`$TENANT\` |"
            echo "| Workspace | \`$WORKSPACE_ID\` |"
            echo "| Core release | \`$CORE_TAG\` |"
            echo "| Modules | ${ENABLED//,/, } |"
            echo "| Dry run | $DRY_RUN |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "Validation passed: tenant '$TENANT', workspace '$WORKSPACE_ID', core release '$CORE_TAG', modules: ${ENABLED//,/, }."

      # Optional guard against deploying one tenant's release into another tenant's
      # workspace. If the GitHub Environment has a variable named WORKSPACE_ID, the
      # workspace_id you typed must match it. No variable = no check.
      - name: Cross-check workspace against the environment's registered workspace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_NAME: ${{ inputs.environment_name }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
        run: |
          set +e
          REGISTERED=$(gh api "repos/${GH_REPO}/environments/${ENV_NAME}/variables/WORKSPACE_ID" --jq .value 2>err.txt)
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            if grep -q "404" err.txt; then
              echo "::notice::Environment '$ENV_NAME' has no WORKSPACE_ID variable, so the workspace ID was not cross-checked. Reviewers: verify it by eye."
            else
              echo "::warning::Could not read the registered workspace for environment '$ENV_NAME' ($(cat err.txt)). The workspace ID was not cross-checked."
            fi
            exit 0
          fi

          if [ "${REGISTERED,,}" != "${WORKSPACE_ID,,}" ]; then
            echo "::error::workspace_id $WORKSPACE_ID does not match the workspace registered for environment '$ENV_NAME' ($REGISTERED). Check you chose the right tenant and workspace."
            exit 1
          fi
          echo "workspace_id matches the workspace registered for environment '$ENV_NAME'."

      # GitHub silently CREATES any environment a job references if it doesn't
      # exist, with no reviewers, which would skip the Prod approval gate
      # entirely. Fail closed on that. This is also what stops a typo'd tenant.
      - name: Verify environment has required reviewers
        if: ${{ inputs.require_protected_environment }}
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ inputs.environment_name }}
        run: |
          set +e
          BODY=$(gh api "repos/${GITHUB_REPOSITORY}/environments/${ENV_NAME}" 2>err.txt)
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            if grep -q "404" err.txt; then
              echo "::error::GitHub Environment '$ENV_NAME' does not exist. Running would auto-create it with no approval gate. Create it with required reviewers first."
              exit 1
            fi
            echo "::warning::Could not verify protection rules on environment '$ENV_NAME' ($(cat err.txt)). Confirm required reviewers are configured."
            exit 0
          fi

          REVIEWER_RULES=$(echo "$BODY" | jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length')
          if [ "$REVIEWER_RULES" -eq 0 ]; then
            echo "::error::Environment '$ENV_NAME' has no required reviewers. Refusing to deploy to Prod without an approval gate."
            exit 1
          fi
          echo "Environment '$ENV_NAME' has required reviewers configured."

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment_name }}
      # Shows up as the "View deployment" link in the repo's Deployments page, so
      # each environment's history links straight to the release it received.
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.core_release_tag }}
    # One deploy per tenant at a time; a second request queues rather than racing.
    concurrency:
      group: oea-deploy-${{ inputs.tenant }}
      cancel-in-progress: false
    outputs:
      reason: ${{ steps.outcome.outputs.reason }}

    steps:
      # The request body is built (and printed) on every run, dry or not, so a
      # dry run shows exactly what a real run would send.
      - name: Build deployment request
        env:
          TENANT: ${{ inputs.tenant }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          CORE_TAG: ${{ inputs.core_release_tag }}
          MODULES_JSON: ${{ needs.validate.outputs.modules_json }}
        run: |
          # edgraph_release_tag is deliberately not sent: the notebook defaults it
          # to blank, which makes it a Core-only run (EdGraph is neither fetched
          # nor deployed).
          jq -n \
            --arg tenant "$TENANT" \
            --arg ws "$WORKSPACE_ID" \
            --arg modules "$MODULES_JSON" \
            --arg core "$CORE_TAG" \
            '{
              executionData: {
                parameters: {
                  tenant_name:      { value: $tenant,  type: "string" },
                  workspace_id:     { value: $ws,      type: "string" },
                  modules_json:     { value: $modules, type: "string" },
                  core_release_tag: { value: $core,    type: "string" }
                }
              }
            }' > request.json
          echo "Request body for the Fabric 'Run notebook' call:"
          jq . request.json

      - name: Get Fabric access token
        if: ${{ !inputs.dry_run }}
        id: get_token
        env:
          SERVICE_PRINCIPAL_TENANT_ID: ${{ secrets.SERVICE_PRINCIPAL_TENANT_ID }}
          SERVICE_PRINCIPAL_CLIENT_ID: ${{ secrets.SERVICE_PRINCIPAL_CLIENT_ID }}
          SERVICE_PRINCIPAL_CLIENT_SECRET: ${{ secrets.SERVICE_PRINCIPAL_CLIENT_SECRET }}
        run: |
          # Same client-credentials pattern already used elsewhere in this
          # repo (see the disabled notebook_update.yml/manual.yml).
          for VAR in SERVICE_PRINCIPAL_TENANT_ID SERVICE_PRINCIPAL_CLIENT_ID SERVICE_PRINCIPAL_CLIENT_SECRET; do
            if [ -z "${!VAR}" ]; then
              echo "::error::secret $VAR is empty or not available to this environment"
              exit 1
            fi
          done

          RESPONSE=$(curl -s -X POST "https://login.microsoftonline.com/${SERVICE_PRINCIPAL_TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${SERVICE_PRINCIPAL_CLIENT_ID}" \
            -d "client_secret=${SERVICE_PRINCIPAL_CLIENT_SECRET}" \
            -d "scope=https://api.fabric.microsoft.com/.default" \
            -d "grant_type=client_credentials")

          ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
          if [ -n "$ERROR" ]; then
            echo "::error::Token request failed: $(echo "$RESPONSE" | jq -r '.error_description')"
            exit 1
          fi

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::No access_token in response"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger deployment notebook run
        if: ${{ !inputs.dry_run }}
        id: trigger
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
          DEPLOYMENT_NOTEBOOK_WORKSPACE_ID: ${{ secrets.DEPLOYMENT_NOTEBOOK_WORKSPACE_ID }}
          DEPLOYMENT_NOTEBOOK_ID: ${{ secrets.DEPLOYMENT_NOTEBOOK_ID }}
        run: |
          for VAR in DEPLOYMENT_NOTEBOOK_WORKSPACE_ID DEPLOYMENT_NOTEBOOK_ID; do
            if [ -z "${!VAR}" ]; then
              echo "::error::secret $VAR is empty or not available to this environment"
              exit 1
            fi
          done

          HTTP_CODE=$(curl -s -D headers.txt -o body.json -w "%{http_code}" -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${DEPLOYMENT_NOTEBOOK_WORKSPACE_ID}/items/${DEPLOYMENT_NOTEBOOK_ID}/jobs/instances?jobType=RunNotebook" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data @request.json)

          if [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Failed to trigger notebook run (HTTP $HTTP_CODE)"
            cat body.json
            exit 1
          fi

          LOCATION=$(grep -i '^location:' headers.txt | sed 's/^[Ll]ocation: //' | tr -d '\r\n')
          if [ -z "$LOCATION" ]; then
            echo "::error::No Location header returned to poll for job status"
            exit 1
          fi
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"
          echo "Triggered. Polling: $LOCATION"

      - name: Poll until the notebook run finishes
        if: ${{ !inputs.dry_run }}
        id: poll
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
          LOCATION: ${{ steps.trigger.outputs.location }}
        run: |
          # 60 attempts * 15s = up to 15 minutes. Adjust if real deploys
          # (e.g. a first-time Prod deploy with many modules) run longer.
          for i in $(seq 1 60); do
            sleep 15
            STATUS_JSON=$(curl -s "$LOCATION" -H "Authorization: Bearer $TOKEN")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status // "Unknown"')
            echo "Attempt $i: status=$STATUS"

            if [ "$STATUS" == "Completed" ]; then
              echo "Deployment succeeded."
              exit 0
            fi
            if [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "Deduped" ]; then
              DETAIL=$(echo "$STATUS_JSON" | jq -r '(.failureReason.message // .failureReason // "") | tostring' | tr '\r\n' '  ' | cut -c1-300)
              echo "reason=Fabric reported $STATUS${DETAIL:+: $DETAIL}" >> "$GITHUB_OUTPUT"
              echo "::error::Deployment did not succeed, status: $STATUS"
              echo "$STATUS_JSON" | jq .
              exit 1
            fi
          done

          echo "reason=Timed out after 15 minutes waiting for Fabric to finish" >> "$GITHUB_OUTPUT"
          echo "::error::Timed out after 15 minutes waiting for the notebook run to finish"
          exit 1

      # Turns whichever step failed into one readable sentence for the deployment log.
      - name: Work out the outcome
        if: ${{ always() && !inputs.dry_run }}
        id: outcome
        env:
          TOKEN_OUTCOME: ${{ steps.get_token.outcome }}
          TRIGGER_OUTCOME: ${{ steps.trigger.outcome }}
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          POLL_REASON: ${{ steps.poll.outputs.reason }}
        run: |
          REASON=""
          if [ "$TOKEN_OUTCOME" = "failure" ]; then
            REASON="Could not get a Fabric access token (step 'Get Fabric access token')."
          elif [ "$TRIGGER_OUTCOME" = "failure" ]; then
            REASON="Fabric did not accept the run request (step 'Trigger deployment notebook run')."
          elif [ "$POLL_OUTCOME" = "failure" ]; then
            REASON="${POLL_REASON:-Fabric reported a failure (step 'Poll until the notebook run finishes').}"
          fi
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Dry run complete
        if: ${{ inputs.dry_run }}
        env:
          TENANT: ${{ inputs.tenant }}
          CORE_TAG: ${{ inputs.core_release_tag }}
          ENV_NAME: ${{ inputs.environment_name }}
        run: |
          {
            echo "### Dry run: nothing was deployed"
            echo "All checks passed and the approval gate for environment \`$ENV_NAME\` was cleared."
            echo "The request above was built but **not sent**. No call was made to Entra ID or Fabric."
            echo "Re-run with dry_run unchecked to deploy \`$CORE_TAG\` to \`$TENANT\`."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "DRY RUN: would deploy $CORE_TAG to $TENANT. No call was made to Entra ID or Fabric."

  # Runs whether the deploy succeeded, failed or was cancelled, so the log also shows
  # attempts that went wrong. A run that failed validation is not a deployment attempt
  # and is not recorded here; the Actions run history already shows it.
  record:
    needs: [validate, deploy]
    if: ${{ always() && needs.validate.result == 'success' && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout (for the log script)
        uses: actions/checkout@v4

      - name: Record deployment in the logs branch
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          TENANT: ${{ inputs.tenant }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          CORE_TAG: ${{ inputs.core_release_tag }}
          MODULES_ENABLED: ${{ needs.validate.outputs.modules_enabled }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REASON: ${{ needs.deploy.outputs.reason }}
        run: |
          case "$DEPLOY_RESULT" in
            success)   STATUS="success" ;;
            cancelled) STATUS="cancelled" ;;
            *)         STATUS="failed" ;;
          esac

          ERR="$REASON"
          if [ "$STATUS" = "failed" ] && [ -z "$ERR" ]; then
            ERR="The deploy job failed before Fabric reported a result (for example the approval was rejected). See the run."
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Best effort: when the run started, and who approved it.
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" 2>/dev/null || echo '{}')
          STARTED=$(echo "$RUN_JSON" | jq -r '.run_started_at // ""' 2>/dev/null || echo "")
          APPROVERS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
            --jq '[.[] | select(.state=="approved") | .user.login] | unique' 2>/dev/null || echo '[]')
          echo "$APPROVERS" | jq -e 'type == "array"' >/dev/null 2>&1 || APPROVERS='[]'

          # The workspace is logged only as its first 8 characters: enough to tell
          # workspaces apart without publishing the full ID in a repo-wide log.
          ENTRY=$(jq -cn \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg started_at "$STARTED" \
            --arg tenant "$TENANT" \
            --arg workspace "${WORKSPACE_ID:0:8}-****" \
            --arg release "$CORE_TAG" \
            --arg modules "$MODULES_ENABLED" \
            --argjson dry "$([ "$DRY_RUN" = "true" ] && echo true || echo false)" \
            --arg status "$STATUS" \
            --arg by "$ACTOR" \
            --argjson approvers "$APPROVERS" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --arg url "$RUN_URL" \
            --arg error "$ERR" \
            '{timestamp: $timestamp, started_at: $started_at, tenant: $tenant, workspace: $workspace,
              core_release_tag: $release, modules_enabled: ($modules | split(",") | map(select(length > 0))),
              dry_run: $dry, status: $status, deployed_by: $by, approved_by: $approvers,
              run_id: ($run_id | tonumber), run_attempt: $attempt, run_url: $url,
              error: (if $error == "" then null else $error end)}')
          echo "Entry: $ENTRY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LOGDIR="${RUNNER_TEMP:-/tmp}/deploy-log"

          # Several deploys can finish at once. Each attempt starts from the latest
          # remote state and re-applies this one entry, so a rejected push is simply
          # retried and no entry is lost or merged wrongly.
          for ATTEMPT in 1 2 3 4 5; do
            rm -rf "$LOGDIR"; git worktree prune; git branch -D logs >/dev/null 2>&1 || true
            if git fetch -q origin +refs/heads/logs:refs/remotes/origin/logs 2>/dev/null; then
              git worktree add -q -B logs "$LOGDIR" origin/logs
            else
              # First ever deployment: create the branch with no history from main.
              git worktree add -q --detach "$LOGDIR"
              git -C "$LOGDIR" checkout -q --orphan logs
              git -C "$LOGDIR" rm -rq -f . 2>/dev/null || true
            fi

            python3 .github/scripts/record_deployment.py --dir "$LOGDIR" --entry "$ENTRY"
            git -C "$LOGDIR" add -A
            git -C "$LOGDIR" commit -q -m "deploy log: ${TENANT} ${CORE_TAG} ${STATUS}"

            if git -C "$LOGDIR" push -q origin logs; then
              echo "Recorded (attempt $ATTEMPT)."
              {
                echo "### Deployment recorded"
                echo "| | |"
                echo "|---|---|"
                echo "| Result | $STATUS |"
                echo "| Deployed by | $ACTOR |"
                echo "| Approved by | $(echo "$APPROVERS" | jq -r 'if length == 0 then "n/a" else join(", ") end') |"
                echo "| Log | [logs branch](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/logs/README.md) |"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            fi
            echo "Push rejected (attempt $ATTEMPT), retrying from the latest log."
            sleep $((ATTEMPT * 2))
          done

          echo "::error::Could not record the deployment after 5 attempts."
          exit 1
