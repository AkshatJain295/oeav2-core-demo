name: Deploy to Dev

# Deploys a build (usually a .dev release cut from a feature branch) to the
# shared Dev workspace for testing. Nothing about the target is stored in the repo:
# you supply the workspace, the modules and the release each time.
on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: "GUID of the Dev Fabric workspace"
        required: true
      core_release_tag:
        description: "e.g. v2026.09.1.dev12 (a production tag also works)"
        required: true
      modules:
        description: "Modules to deploy: edit the true/false values"
        required: true
        default: '{"fetch_releases":true,"create_folders":false,"create_environment":true,"create_lakehouses":true,"deploy_notebooks":true,"deploy_dashboards":false,"bootstrap_and_rebind":false}'
      dry_run:
        description: "Run every check and approval but make no call to Fabric"
        type: boolean
        required: false
        default: false

# contents: write is needed only by the record job, which writes the deployment log.
permissions:
  contents: write
  actions: read

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy-notebook.yml
    with:
      tenant: "dev"
      workspace_id: ${{ inputs.workspace_id }}
      core_release_tag: ${{ inputs.core_release_tag }}
      modules: ${{ inputs.modules }}
      environment_name: "dev"
      allow_dev_tags: true
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
