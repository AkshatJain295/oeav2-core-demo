name: Deploy to Prod (per tenant)

# Nothing about a tenant is stored in the repo or set up in GitHub: you supply the
# tenant name, the workspace, the modules and the release each time. The tenant name is
# only a label (it appears in the approval and the deployment log); nothing looks it up.
# Every Prod deploy waits for approval from the reviewers of ONE shared GitHub
# Environment named "production", who check the exact values before approving.
# The notebook runs INSIDE the workspace you name, found by its display name there.
on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name: a label shown in the approval and the deployment log, e.g. tenant-a. Any name works."
        required: true
      workspace_id:
        description: "GUID of the tenant's Fabric workspace (reviewers check it before approving)"
        required: true
      entra_tenant_id:
        description: "Entra tenant ID that owns the workspace. Leave blank for our own (default) tenant"
        required: false
        default: ""
      credential_set:
        description: "Leave blank for the default service principal. Or a name, e.g. acme, to use the GitHub secrets SPN_ACME_CLIENT_ID / SPN_ACME_CLIENT_SECRET"
        required: false
        default: ""
      core_release_tag:
        description: "Production tag only (vYYYY.MM.<n>), e.g. v2026.09.1"
        required: true
      modules:
        description: "Modules to deploy: edit the true/false values"
        required: true
        default: '{"fetch_releases":true,"create_folders":false,"create_environment":true,"create_lakehouses":true,"deploy_notebooks":true,"deploy_dashboards":false,"bootstrap_and_rebind":false}'
      dry_run:
        description: "Run every check and approval but make no call to Fabric"
        type: boolean
        required: false
        default: false

# contents: write is needed only by the record job, which writes the deployment log.
permissions:
  contents: write
  actions: read

jobs:
  # A run dispatched from another branch would use THAT branch's copy of the
  # workflow files. Prod deploys must always use the reviewed version on main.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Prod deploys must be dispatched from main (got $GITHUB_REF). Set 'Use workflow from' to main."
            exit 1
          fi

  deploy-prod:
    needs: guard
    uses: ./.github/workflows/deploy-notebook.yml
    with:
      tenant: ${{ inputs.tenant }}
      workspace_id: ${{ inputs.workspace_id }}
      entra_tenant_id: ${{ inputs.entra_tenant_id }}
      credential_set: ${{ inputs.credential_set }}
      core_release_tag: ${{ inputs.core_release_tag }}
      modules: ${{ inputs.modules }}
      # One shared Prod environment, created once in GitHub with required reviewers.
      # It is the approval gate for every tenant. If it is missing or has no reviewers
      # the run warns loudly (and is refused if the repository variable
      # REQUIRE_PROD_APPROVAL is "true"), because GitHub would otherwise auto-create it
      # with no gate at all.
      environment_name: "production"
      allow_dev_tags: false
      require_protected_environment: true
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
