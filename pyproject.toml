[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oea-v2"
dynamic = ["version"]
description = "Stand-in package for the CI/CD demo (mirrors the real repo's packaging)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "packages/oea/src" }

[tool.setuptools.packages.find]
where = ["packages/oea/src"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
