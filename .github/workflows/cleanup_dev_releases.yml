name: Cleanup dev releases

# Deletes dev/test releases (and their git tags) older than the retention
# period. Only tags matching vYYYY.MM.<n>.dev<run> are ever considered, so a
# production tag can never be selected.
#
# Scheduled runs delete for real. Manual runs default to dry-run: start with
# one to see what would go.
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete dev releases older than this many days"
        required: false
        default: "14"
      dry_run:
        description: "List what would be deleted without deleting anything"
        type: boolean
        required: false
        default: true

permissions:
  contents: write  # deleting releases and tags

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired dev releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RETENTION_DAYS: ${{ inputs.retention_days || '14' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if ! [[ "$RETENTION_DAYS" =~ ^[0-9]+$ ]] || [ "$RETENTION_DAYS" -lt 1 ]; then
            echo "::error::retention_days must be a whole number of at least 1 (got '$RETENTION_DAYS')."
            exit 1
          fi

          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          echo "Dev releases created before $(date -u -d "@${CUTOFF}" +%Y-%m-%dT%H:%M:%SZ) are expired (retention ${RETENTION_DAYS} days, dry_run=${DRY_RUN})."

          gh release list --limit 1000 --json tagName,createdAt \
            | jq -r --argjson cutoff "$CUTOFF" '
                .[]
                | select(.tagName | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]+\\.dev[0-9]+$"))
                | select((.createdAt | fromdateiso8601) < $cutoff)
                | .tagName' > expired.txt

          COUNT=$(wc -l < expired.txt | tr -d ' ')
          echo "Found $COUNT expired dev release(s)."

          while read -r TAG; do
            [ -z "$TAG" ] && continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry run] would delete $TAG"
            else
              gh release delete "$TAG" --cleanup-tag --yes
              echo "deleted $TAG"
            fi
          done < expired.txt
